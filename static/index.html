<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SingAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"> 
 <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>

  <div class="sidebar">
    <div class="logo">
    <span class="logo-sing">Sing</span><span class="logo-ai">AI</span>
    </div>
    <div class="nav-item ativo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    </div>
  </div>

  <div class="main">
    <div class="hero-label">SingAI</div>
    <h1>Cante, avalie<br>e evolua com sua voz.</h1>

    <div class="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar música...">
    </div>

    <div class="secao-titulo">Catálogo</div>
    <div class="catalogo" id="catalogo"></div>
  </div>

  <div class="painel-direito">
    <div class="painel-titulo">Ações rápidas</div>

    <div class="card-acao principal" id="btnAbrirModal">
      <div class="icone-acao">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="titulo">Cantar agora</div>
    </div>

    <div class="card-acao secundario">
      <div class="icone-acao">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="titulo">Meu perfil</div>
    </div>

    <div class="painel-titulo" style="margin-top:20px;">Atividade recente</div>
    <div id="historico">
      <div class="historico-item">
        <span style="opacity:0.5; font-size:0.85rem;">Exemplo em breve...</span>
      </div>
    </div>
  </div>

  <!-- MODAL DE GRAVAÇÃO -->
  <div class="modal-fundo" id="modalFundo">
    <div class="modal">
      <h2>Cantar</h2>
      <select id="listaMusicas"></select>
      <div class="botoes">
        <button id="btnGravar">Gravar</button>
        <button id="btnParar" disabled>Parar</button>
      </div>
      <div id="resultado">Escolha uma música e comece a gravar!</div>
      <button id="fecharModal">Fechar</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
