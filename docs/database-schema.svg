<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Diagrama do banco de dados do SingAI</title>
  <desc>Três tabelas: usuarios e musicas se relacionam com performances através de chaves estrangeiras.</desc>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Linha usuarios -> performances -->
  <path d="M170,140 L170,200 L330,260" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="178" y="182" font-size="12" fill="#5f5e5a">1</text>
  <text x="300" y="252" font-size="12" fill="#5f5e5a">N</text>

  <!-- Linha musicas -> performances -->
  <path d="M730,164 L730,210 L510,260" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="738" y="188" font-size="12" fill="#5f5e5a">1</text>
  <text x="522" y="252" font-size="12" fill="#5f5e5a">N</text>

  <!-- Tabela usuarios -->
  <g>
    <rect x="40" y="60" width="260" height="80" rx="6" fill="#ffffff" stroke="#185fa5" stroke-width="1.2"/>
    <rect x="40" y="60" width="260" height="32" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"/>
    <rect x="40" y="84" width="260" height="8" fill="#e6f1fb"/>
    <text x="170" y="81" font-size="14" font-weight="600" fill="#0c447c" text-anchor="middle">usuarios</text>

    <line x1="40" y1="116" x2="300" y2="116" stroke="#d3d1c7" stroke-width="1"/>

    <text x="56" y="108" font-size="12.5" fill="#2c2c2a">id</text>
    <text x="140" y="108" font-size="12.5" fill="#5f5e5a">INTEGER</text>
    <text x="220" y="108" font-size="11" font-weight="600" fill="#0c447c">PK</text>

    <text x="56" y="132" font-size="12.5" fill="#2c2c2a">nome</text>
    <text x="140" y="132" font-size="12.5" fill="#5f5e5a">TEXT</text>
    <text x="220" y="132" font-size="11" font-weight="600" fill="#5f5e5a">UNIQUE</text>
  </g>

  <!-- Tabela musicas -->
  <g>
    <rect x="600" y="60" width="260" height="104" rx="6" fill="#ffffff" stroke="#0f6e56" stroke-width="1.2"/>
    <rect x="600" y="60" width="260" height="32" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
    <rect x="600" y="84" width="260" height="8" fill="#e1f5ee"/>
    <text x="730" y="81" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">musicas</text>

    <line x1="600" y1="116" x2="860" y2="116" stroke="#d3d1c7" stroke-width="1"/>
    <line x1="600" y1="140" x2="860" y2="140" stroke="#d3d1c7" stroke-width="1"/>

    <text x="616" y="108" font-size="12.5" fill="#2c2c2a">id</text>
    <text x="700" y="108" font-size="12.5" fill="#5f5e5a">INTEGER</text>
    <text x="780" y="108" font-size="11" font-weight="600" fill="#085041">PK</text>

    <text x="616" y="132" font-size="12.5" fill="#2c2c2a">titulo</text>
    <text x="700" y="132" font-size="12.5" fill="#5f5e5a">TEXT</text>
    <text x="780" y="132" font-size="11" font-weight="600" fill="#5f5e5a">NOT NULL</text>

    <text x="616" y="156" font-size="12.5" fill="#2c2c2a">artista</text>
    <text x="700" y="156" font-size="12.5" fill="#5f5e5a">TEXT</text>
  </g>

  <!-- Tabela performances -->
  <g>
    <rect x="290" y="260" width="320" height="200" rx="6" fill="#ffffff" stroke="#993c1d" stroke-width="1.2"/>
    <rect x="290" y="260" width="320" height="32" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="1.2"/>
    <rect x="290" y="284" width="320" height="8" fill="#faece7"/>
    <text x="450" y="281" font-size="14" font-weight="600" fill="#712b13" text-anchor="middle">performances</text>

    <line x1="290" y1="316" x2="610" y2="316" stroke="#d3d1c7" stroke-width="1"/>
    <line x1="290" y1="340" x2="610" y2="340" stroke="#d3d1c7" stroke-width="1"/>
    <line x1="290" y1="364" x2="610" y2="364" stroke="#d3d1c7" stroke-width="1"/>
    <line x1="290" y1="388" x2="610" y2="388" stroke="#d3d1c7" stroke-width="1"/>
    <line x1="290" y1="412" x2="610" y2="412" stroke="#d3d1c7" stroke-width="1"/>
    <line x1="290" y1="436" x2="610" y2="436" stroke="#d3d1c7" stroke-width="1"/>

    <text x="306" y="308" font-size="12.5" fill="#2c2c2a">id</text>
    <text x="440" y="308" font-size="12.5" fill="#5f5e5a">INTEGER</text>
    <text x="550" y="308" font-size="11" font-weight="600" fill="#712b13">PK</text>

    <text x="306" y="332" font-size="12.5" fill="#2c2c2a">usuario_id</text>
    <text x="440" y="332" font-size="12.5" fill="#5f5e5a">INTEGER</text>
    <text x="550" y="332" font-size="11" font-weight="600" fill="#185fa5">FK</text>

    <text x="306" y="356" font-size="12.5" fill="#2c2c2a">musica_id</text>
    <text x="440" y="356" font-size="12.5" fill="#5f5e5a">INTEGER</text>
    <text x="550" y="356" font-size="11" font-weight="600" fill="#0f6e56">FK</text>

    <text x="306" y="380" font-size="12.5" fill="#2c2c2a">arquivo_audio</text>
    <text x="440" y="380" font-size="12.5" fill="#5f5e5a">TEXT</text>
    <text x="550" y="380" font-size="11" font-weight="600" fill="#5f5e5a">NOT NULL</text>

    <text x="306" y="404" font-size="12.5" fill="#2c2c2a">transcricao</text>
    <text x="440" y="404" font-size="12.5" fill="#5f5e5a">TEXT</text>

    <text x="306" y="428" font-size="12.5" fill="#2c2c2a">pontuacao</text>
    <text x="440" y="428" font-size="12.5" fill="#5f5e5a">REAL</text>

    <text x="306" y="452" font-size="12.5" fill="#2c2c2a">data</text>
    <text x="440" y="452" font-size="12.5" fill="#5f5e5a">TEXT</text>
    <text x="550" y="452" font-size="11" font-weight="600" fill="#5f5e5a">DEFAULT</text>
  </g>
</svg>
